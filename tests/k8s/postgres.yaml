apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: gpu-telemetry-smoke-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-telemetry-smoke-postgres
  template:
    metadata:
      labels:
        app: gpu-telemetry-smoke-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gpu_telemetry
            - name: POSTGRES_USER
              value: gpu_telemetry
            - name: POSTGRES_PASSWORD
              value: gpu_telemetry_smoke
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U gpu_telemetry -d gpu_telemetry"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
