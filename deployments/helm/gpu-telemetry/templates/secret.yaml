{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.database.secretKey }}: {{ required "database.url is required when database.createSecret=true" .Values.database.url | b64enc | quote }}
{{- end }}
