name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gpu_telemetry
          POSTGRES_USER: gpu_telemetry
          POSTGRES_PASSWORD: gpu_telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpu_telemetry -d gpu_telemetry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gpu_telemetry:gpu_telemetry_test@localhost:5432/gpu_telemetry?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l $(find cmd internal tests -name '*.go' -type f))"
      - name: Vet and lint
        run: go vet ./...
      - name: Unit and integration tests
        run: go test -race -count=1 ./...
      - name: Enforce 90 percent core unit coverage
        run: make coverage
      - name: Generate OpenAPI
        run: make openapi
      - name: Ensure generated API contract is committed
        run: git diff --exit-code -- api/openapi.json
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Validate Helm chart
        run: make helm-lint helm-template
      - name: Build application binaries
        run: make build

  end-to-end:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Docker Compose end-to-end pipeline test
        run: make test-e2e

  container-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, end-to-end]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          build-args: APP=api
          tags: ghcr.io/${{ github.repository }}:latest-api
      - name: Build and push Streamer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          build-args: APP=streamer
          tags: ghcr.io/${{ github.repository }}:latest-streamer
      - name: Build and push Collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          push: true
          build-args: APP=collector
          tags: ghcr.io/${{ github.repository }}:latest-collector
