apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gpu-telemetry.fullname" . }}-streamer
  labels:
    {{- include "gpu-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: streamer
spec:
  {{- if not .Values.streamer.autoscaling.enabled }}
  replicas: {{ .Values.streamer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gpu-telemetry.selectorLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "streamer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gpu-telemetry.selectorLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "streamer") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gpu-telemetry.serviceAccountName" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gpu-telemetry.selectorLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "streamer") | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "gpu-telemetry.selectorLabels" (dict "Values" .Values "Release" .Release "Chart" .Chart "component" "streamer") | nindent 14 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: streamer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tags.streamer }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: TELEMETRY_SOURCE_ID
              value: {{ .Values.streamer.sourceID | quote }}
            - name: STREAMER_INTERVAL
              value: {{ .Values.streamer.interval | quote }}
            - name: TELEMETRY_CSV_PATH
              value: {{ if .Values.streamer.existingClaim }}{{ printf "%s/%s" .Values.streamer.mountPath .Values.streamer.csvFile | quote }}{{ else }}{{ printf "/app/data/%s" .Values.streamer.csvFile | quote }}{{ end }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
          resources:
            {{- toYaml .Values.streamer.resources | nindent 12 }}
          {{- if .Values.streamer.existingClaim }}
          volumeMounts:
            - name: csv-data
              mountPath: {{ .Values.streamer.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.streamer.existingClaim }}
      volumes:
        - name: csv-data
          persistentVolumeClaim:
            claimName: {{ .Values.streamer.existingClaim }}
      {{- end }}
